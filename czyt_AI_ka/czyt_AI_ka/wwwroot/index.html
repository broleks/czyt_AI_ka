<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>czyt_AI_ka</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="czyt_AI_ka.styles.css" />
    <link rel="stylesheet" href="css/snakeGame.css" />
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="js/snakeGame.js"></script>

    <script>
        window.initMiniGame = function () {

            const target = document.getElementById("target");

            function moveTarget() {
                const box = document.querySelector(".mini-game");
                const maxX = box.clientWidth - 40;
                const maxY = box.clientHeight - 40;

                const x = Math.floor(Math.random() * maxX);
                const y = Math.floor(Math.random() * maxY);

                target.style.left = x + "px";
                target.style.top = y + "px";
            }

            moveTarget();

            target.addEventListener("click", function () {
                DotNet.invokeMethodAsync("MauiBlazorHybrid", "ClickedTarget");
                moveTarget();
            });
        }
    </script>

    <script>
        window.scrollTextarea = (el, amount) => {
            if (el) el.scrollTop += amount;
        }
    </script>

</body>

</html>
