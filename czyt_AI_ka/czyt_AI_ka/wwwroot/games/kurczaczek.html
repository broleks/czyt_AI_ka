<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kurczaczek i Ziarenka</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body {
            margin: 0;
            background: #f7f1d4;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .game-shell {
            width: min(860px, 96vw);
            background: #fff7e8;
            border-radius: 18px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
            padding: 18px;
            display: grid;
            gap: 14px;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        header h1 {
            font-size: 1.4rem;
            margin: 0;
        }

        .stats {
            display: flex;
            gap: 12px;
            font-weight: 600;
            flex-wrap: wrap;
        }

        .difficulty {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .difficulty select {
            border-radius: 999px;
            border: 1px solid #d6a843;
            padding: 6px 12px;
            background: #fff4d1;
            font-weight: 600;
            cursor: pointer;
        }

        canvas {
            width: 100%;
            height: auto;
            background: #d3f1a6;
            border-radius: 14px;
            border: 3px solid #9fc35c;
        }

        .restart-btn {
            border: none;
            border-radius: 12px;
            padding: 10px;
            background: #ffd566;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        }

        .restart-btn:active {
            transform: translateY(1px);
        }

        .restart-btn:focus-visible {
            outline: 2px solid #d6a843;
            outline-offset: 2px;
        }

        .restart-btn {
            justify-self: center;
            min-width: 180px;
        }

        .hint {
            font-size: 0.9rem;
            color: #4a4a4a;
            text-align: center;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 25, 10, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 10;
        }

        .overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-card {
            background: #fff7e8;
            border-radius: 18px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
            max-width: 420px;
        }

        .overlay-card h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1.5rem;
        }

        .overlay-card p {
            margin: 0 0 16px;
            color: #4a4a4a;
        }

        .overlay-card button {
            min-width: 200px;
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <header>
            <h1>Kurczaczek i Ziarenka</h1>
            <label class="difficulty" for="difficulty">
                Poziom trudności
                <select id="difficulty">
                    <option value="easy">Łatwy</option>
                    <option value="medium" selected>Średni</option>
                    <option value="hard">Trudny</option>
                </select>
            </label>
            <div class="stats">
                <span id="score">Wynik: 0</span>
                <span id="lives">Życia: 3</span>
                <span id="time">Czas: 0 s</span>
            </div>
        </header>

        <canvas id="gameCanvas" width="600" height="400" aria-label="Plansza gry"></canvas>

        <button class="restart-btn" type="button" id="restart">Zagraj ponownie</button>
        <div class="hint">Steruj strzałkami na klawiaturze.</div>
    </div>

    <div class="overlay" id="winOverlay" aria-live="polite">
        <div class="overlay-card">
            <h2>Wygrana!</h2>
            <p>Kurczaczek zebrał wszystkie ziarenka. Świetna robota!</p>
            <button class="restart-btn" type="button" id="playAgain">Zagraj ponownie</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const livesEl = document.getElementById("lives");
        const timeEl = document.getElementById("time");
        const restartBtn = document.getElementById("restart");
        const difficultySelect = document.getElementById("difficulty");
        const winOverlay = document.getElementById("winOverlay");
        const playAgainBtn = document.getElementById("playAgain");
        const gridSize = 10;
        const cols = 12;
        const rows = 8;
        const tileSize = canvas.width / cols;
        canvas.height = rows * tileSize;
        const safeZoneColumns = 2;
        const safeZoneStart = cols - safeZoneColumns;
        const foxDenImageSrc = "images/games/fox-den.png";
        const coopImageSrc = "images/games/coop.png";
        const foxDenImage = new Image();
        const coopImage = new Image();
        const difficultyConfig = {
            easy: {
                label: "Łatwy",
                foxSpawnIntervalMs: 30000,
                grainsToWin: 10
            },
            medium: {
                label: "Średni",
                foxSpawnIntervalMs: 20000,
                grainsToWin: 20
            },
            hard: {
                label: "Trudny",
                foxSpawnIntervalMs: 10000,
                grainsToWin: 30
            }
        };
        const difficultySettings = {
            foxSpeedMs: 650,
            foxSpawnIntervalMs: difficultyConfig.medium.foxSpawnIntervalMs,
            foxActiveDurationMs: 10000,
            grainsToWin: difficultyConfig.medium.grainsToWin
        };
        const foxDen = { x: 0, y: 0, width: 2, height: 2 };
        const coopZone = { x: safeZoneStart, y: 0, width: safeZoneColumns, height: 2 };

        let chick = { x: 0, y: 0 };
        let grain = { x: 0, y: 0 };
        let fox = { x: 0, y: 0, active: false, returning: false };
        let score = 0;
        let lives = 3;
        let timeElapsed = 0;
        let isWin = false;
        let timerId;
        let foxSpawnId;
        let foxMoveId;
        let foxLifetimeId;

        if (foxDenImageSrc) {
            foxDenImage.src = foxDenImageSrc;
            foxDenImage.onload = () => drawScene();
        }

        if (coopImageSrc) {
            coopImage.src = coopImageSrc;
            coopImage.onload = () => drawScene();
        }

        function placeGrain() {
            let newX;
            let newY;
            do {
                newX = Math.floor(Math.random() * cols);
                newY = Math.floor(Math.random() * rows);
            } while (
                (newX === chick.x && newY === chick.y) ||
                newX >= safeZoneStart
            );
            grain = { x: newX, y: newY };
        }

        function resetGame() {
            chick = { x: Math.floor(cols / 2), y: Math.floor(rows / 2) };
            score = 0;
            lives = 3;
            timeElapsed = 0;
            isWin = false;
            stopFox();
            placeGrain();
            updateStats();
            hideWinOverlay();
            drawScene();
            clearInterval(timerId);
            timerId = setInterval(() => {
                timeElapsed += 1;
                updateStats();
            }, 1000);
            clearInterval(foxSpawnId);
            foxSpawnId = setInterval(spawnFox, difficultySettings.foxSpawnIntervalMs);
        }

        function updateStats() {
            scoreEl.textContent = `Wynik: ${score}`;
            livesEl.textContent = `Życia: ${lives}`;
            timeEl.textContent = `Czas: ${timeElapsed} s`;
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#c4e887";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const safeZoneX = safeZoneStart * tileSize;
            ctx.fillStyle = "#ffe08a";
            ctx.fillRect(safeZoneX, 0, safeZoneColumns * tileSize, canvas.height);

            ctx.fillStyle = "#e54848";
            ctx.fillRect(
                foxDen.x * tileSize,
                foxDen.y * tileSize,
                foxDen.width * tileSize,
                foxDen.height * tileSize
            );
            ctx.strokeStyle = "#b33131";
            ctx.lineWidth = 2;
            ctx.strokeRect(
                foxDen.x * tileSize,
                foxDen.y * tileSize,
                foxDen.width * tileSize,
                foxDen.height * tileSize
            );
            if (foxDenImageSrc && foxDenImage.complete) {
                ctx.drawImage(
                    foxDenImage,
                    foxDen.x * tileSize,
                    foxDen.y * tileSize,
                    foxDen.width * tileSize,
                    foxDen.height * tileSize
                );
            }

            ctx.strokeStyle = "rgba(0,0,0,0.1)";
            for (let x = 0; x <= cols; x += 1) {
                ctx.beginPath();
                ctx.moveTo(x * tileSize, 0);
                ctx.lineTo(x * tileSize, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= rows; y += 1) {
                ctx.beginPath();
                ctx.moveTo(0, y * tileSize);
                ctx.lineTo(canvas.width, y * tileSize);
                ctx.stroke();
            }

            ctx.save();
            ctx.strokeStyle = "#c6902b";
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 8]);
            ctx.beginPath();
            ctx.moveTo(safeZoneX, 0);
            ctx.lineTo(safeZoneX, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#b17b1f";
            for (let y = 0; y <= rows; y += 1) {
                const yPos = y * tileSize;
                ctx.beginPath();
                ctx.moveTo(safeZoneX - 6, yPos);
                ctx.lineTo(safeZoneX + 6, yPos);
                ctx.stroke();
            }
            ctx.restore();

            if (coopImageSrc && coopImage.complete) {
                ctx.drawImage(
                    coopImage,
                    coopZone.x * tileSize,
                    coopZone.y * tileSize,
                    coopZone.width * tileSize,
                    coopZone.height * tileSize
                );
            }

            ctx.font = `${tileSize * 0.8}px "Segoe UI Emoji"`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🐣", (chick.x + 0.5) * tileSize, (chick.y + 0.5) * tileSize);
            ctx.fillText("🌾", (grain.x + 0.5) * tileSize, (grain.y + 0.5) * tileSize);
            if (fox.active) {
                ctx.fillText("🦊", (fox.x + 0.5) * tileSize, (fox.y + 0.5) * tileSize);
            }
        }

        function moveChick(dx, dy) {
            if (isWin) {
                return;
            }
            const newX = Math.min(cols - 1, Math.max(0, chick.x + dx));
            const newY = Math.min(rows - 1, Math.max(0, chick.y + dy));
            chick = { x: newX, y: newY };

            if (chick.x === grain.x && chick.y === grain.y) {
                score += 1;
                placeGrain();
                updateStats();
                if (score >= difficultySettings.grainsToWin) {
                    winGame();
                    return;
                }
            }
            if (fox.active && chick.x === fox.x && chick.y === fox.y) {
                handleFoxCatch();
            }
            drawScene();
        }

        function isSafeZoneColumn(x) {
            return x >= safeZoneStart;
        }

        function spawnFox() {
            if (fox.active || isWin) {
                return;
            }
            fox = { x: foxDen.x, y: foxDen.y, active: true, returning: false };
            drawScene();
            clearInterval(foxMoveId);
            foxMoveId = setInterval(moveFox, difficultySettings.foxSpeedMs);
            clearTimeout(foxLifetimeId);
            foxLifetimeId = setTimeout(() => {
                startReturnToDen();
            }, difficultySettings.foxActiveDurationMs);
        }

        function startReturnToDen() {
            if (!fox.active) {
                return;
            }
            fox = { ...fox, returning: true };
        }

        function despawnFox() {
            fox = { x: foxDen.x, y: foxDen.y, active: false, returning: false };
            clearInterval(foxMoveId);
            clearTimeout(foxLifetimeId);
            drawScene();
        }

        function stopFox() {
            fox = { x: foxDen.x, y: foxDen.y, active: false, returning: false };
            clearInterval(foxMoveId);
            clearTimeout(foxLifetimeId);
            clearInterval(foxSpawnId);
            drawScene();
        }

        function handleFoxCatch() {
            lives = Math.max(0, lives - 1);
            chick = { x: Math.floor(cols / 2), y: Math.floor(rows / 2) };
            updateStats();
            despawnFox();
        }

        function moveFox() {
            if (!fox.active || isWin) {
                return;
            }

            if (fox.returning) {
                const targetX = Math.min(
                    foxDen.x + foxDen.width - 1,
                    Math.max(foxDen.x, fox.x)
                );
                const targetY = Math.min(
                    foxDen.y + foxDen.height - 1,
                    Math.max(foxDen.y, fox.y)
                );
                const dx = targetX - fox.x;
                const dy = targetY - fox.y;
                const stepOptions = [];

                if (dx !== 0) {
                    stepOptions.push({
                        x: Math.min(cols - 1, Math.max(0, fox.x + Math.sign(dx))),
                        y: fox.y
                    });
                }
                if (dy !== 0) {
                    stepOptions.push({
                        x: fox.x,
                        y: Math.min(rows - 1, Math.max(0, fox.y + Math.sign(dy)))
                    });
                }

                const nextStep = stepOptions[0];
                if (nextStep) {
                    fox = { ...fox, x: nextStep.x, y: nextStep.y };
                }

                if (
                    fox.x >= foxDen.x &&
                    fox.x < foxDen.x + foxDen.width &&
                    fox.y >= foxDen.y &&
                    fox.y < foxDen.y + foxDen.height
                ) {
                    fox = { x: foxDen.x, y: foxDen.y, active: false, returning: false };
                    clearInterval(foxMoveId);
                    clearTimeout(foxLifetimeId);
                    drawScene();
                    return;
                }
            } else {
                const dx = chick.x - fox.x;
                const dy = chick.y - fox.y;
                const stepOptions = [];

                if (dx !== 0) {
                    stepOptions.push({
                        x: Math.min(cols - 1, Math.max(0, fox.x + Math.sign(dx))),
                        y: fox.y
                    });
                }
                if (dy !== 0) {
                    stepOptions.push({
                        x: fox.x,
                        y: Math.min(rows - 1, Math.max(0, fox.y + Math.sign(dy)))
                    });
                }

                const nextStep = stepOptions.find((step) => !isSafeZoneColumn(step.x));
                if (nextStep) {
                    fox = { ...fox, x: nextStep.x, y: nextStep.y };
                }
            }

            if (fox.active && chick.x === fox.x && chick.y === fox.y) {
                handleFoxCatch();
            } else {
                drawScene();
            }
        }

        function handleDirection(direction) {
            switch (direction) {
                case "up":
                    moveChick(0, -1);
                    break;
                case "down":
                    moveChick(0, 1);
                    break;
                case "left":
                    moveChick(-1, 0);
                    break;
                case "right":
                    moveChick(1, 0);
                    break;
                default:
                    break;
            }
        }

        window.addEventListener("keydown", (event) => {
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
                event.preventDefault();
            }

            if (event.key === "ArrowUp") {
                handleDirection("up");
            } else if (event.key === "ArrowDown") {
                handleDirection("down");
            } else if (event.key === "ArrowLeft") {
                handleDirection("left");
            } else if (event.key === "ArrowRight") {
                handleDirection("right");
            }
        });

        restartBtn.addEventListener("click", () => {
            resetGame();
        });

        playAgainBtn.addEventListener("click", () => {
            resetGame();
        });

        difficultySelect.addEventListener("change", (event) => {
            applyDifficulty(event.target.value);
        });

        function applyDifficulty(level) {
            const setting = difficultyConfig[level] ?? difficultyConfig.medium;
            difficultySettings.foxSpawnIntervalMs = setting.foxSpawnIntervalMs;
            difficultySettings.grainsToWin = setting.grainsToWin;
            resetGame();
        }

        function winGame() {
            isWin = true;
            stopFox();
            clearInterval(timerId);
            showWinOverlay();
            drawScene();
        }

        function showWinOverlay() {
            winOverlay.classList.add("visible");
        }

        function hideWinOverlay() {
            winOverlay.classList.remove("visible");
        }

        resetGame();
    </script>
</body>
</html>
